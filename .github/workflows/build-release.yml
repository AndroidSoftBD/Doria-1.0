name: Build & Release Doria AI APK

on:
  push:
    branches: [main, master]
    tags:
      - 'v*'
  pull_request:
    branches: [main, master]
  workflow_dispatch:
    inputs:
      release_tag:
        description: 'Release Version Tag (e.g. v1.0.0)'
        required: true
        default: 'v1.0.0'

permissions:
  contents: write

jobs:
  build:
    name: Build & Test APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Setup Dummy Keystore & Environment
        run: |
          mkdir -p $HOME/.android
          keytool -genkey -v -keystore app/debug.keystore -alias androiddebugkey -storepass android -keypass android -keyalg RSA -keysize 2048 -validity 10000 -dname "CN=Android Debug,O=Android,C=US" || true
          touch .env
          echo "GEMINI_API_KEY=PLACEHOLDER_KEY" > .env

      - name: Run Unit Tests
        run: |
          chmod +x gradlew || gradle :app:testDebugUnitTest
          ./gradlew :app:testDebugUnitTest || gradle :app:testDebugUnitTest

      - name: Build Debug & Release APKs
        run: |
          chmod +x gradlew || gradle :app:assembleDebug
          ./gradlew :app:assembleDebug || gradle :app:assembleDebug

      - name: Archive Compiled APK
        uses: actions/upload-artifact@v4
        with:
          name: doria-ai-compiled-apk
          path: app/build/outputs/apk/**/*.apk

  release:
    name: Publish to GitHub Releases
    needs: build
    if: startsWith(github.ref, 'refs/tags/v') || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Setup Keystore & Environment
        run: |
          mkdir -p $HOME/.android
          keytool -genkey -v -keystore app/debug.keystore -alias androiddebugkey -storepass android -keypass android -keyalg RSA -keysize 2048 -validity 10000 -dname "CN=Android Debug,O=Android,C=US" || true
          touch .env
          echo "GEMINI_API_KEY=PLACEHOLDER_KEY" > .env

      - name: Build APK for Release
        run: |
          chmod +x gradlew || gradle :app:assembleDebug
          ./gradlew :app:assembleDebug || gradle :app:assembleDebug
          cp app/build/outputs/apk/debug/app-debug.apk doria-ai-v1.0.0.apk || cp $(find app/build/outputs/apk/ -name "*.apk" | head -n 1) doria-ai-v1.0.0.apk

      - name: Determine Release Tag
        id: vars
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "tag=${{ github.event.inputs.release_tag }}" >> $GITHUB_OUTPUT
          else
            echo "tag=${GITHUB_REF#refs/tags/}" >> $GITHUB_OUTPUT
          fi

      - name: Create GitHub Release and Upload APK
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.vars.outputs.tag }}
          name: Doria AI ${{ steps.vars.outputs.tag }}
          body: |
            ### Doria AI Release ${{ steps.vars.outputs.tag }}
            
            **Package ID:** `com.androidsoft.aidoria.bd`
            
            #### Features Included:
            - **Real-Time Voice-to-Text Command Processing:** Interactive microphone input, dynamic volume visualization, and hands-free voice command routing.
            - **Interactive Text Chat Interface:** Real-time conversational interface with quick prompt directives and code highlighting.
            - **Doria 1.0 Free Engine API:** Ultra-fast, lightweight neural engine with sub-millisecond local inference & cloud relay fallback.
            - **Local SQLite / Room Database:** Persistent chat history storage with reactive Flow queries, message deletion, and history clearing.
            - **Cyberpunk Holographic Core:** 3D interactive emblem inspector and real-time system telemetry diagnostics.
          files: |
            doria-ai-v1.0.0.apk
            app/build/outputs/apk/**/*.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
